# 通过 npm Trusted Publishing (OIDC) 发布 —— 不需要任何长期令牌，也不会过期。
#
# 前置（只需在 npmjs.com 做一次，每个包一次）：
#   https://www.npmjs.com/package/<包名>/settings → Trusted Publisher → GitHub Actions
#     Organization or user : wangzhanchao883
#     Repository           : <仓库名>
#     Workflow filename    : publish.yml   （只填文件名，大小写敏感，含扩展名）
#     Environment name     : 留空
#     允许的动作            : 勾上 npm publish
#
# 发布方式：改 package.json 版本号 → commit → 打同名 tag 推上去
#     git tag v0.1.4 && git push origin v0.1.4
#
# 注意：千万不要把任何 NPM_TOKEN / NODE_AUTH_TOKEN 配到这个仓库，
#      否则 npm 会优先使用令牌、放弃 OIDC 通道。

name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # OIDC 认证必需，缺了直接失败
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # 发布构建一律不用缓存

      # Trusted Publishing 要求 npm CLI >= 11.5.1、Node >= 22.14
      - name: Ensure npm >= 11.5.1
        run: npm install -g npm@latest

      # 防止 tag 与 package.json 版本不一致时发错版本
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 $PKG_VERSION 不一致"
            exit 1
          fi
          echo "版本一致: $PKG_VERSION"

      # ===== 临时诊断步：定位 OIDC 信任关系为何不匹配（验证通过后删除）=====
      - name: Diagnose OIDC identity and trust
        if: always()
        run: |
          RESP=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          JWT=$(printf '%s' "$RESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "==== [DIAG] OIDC 令牌声明 ===="
          printf '%s' "$JWT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const b=s.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");const c=JSON.parse(Buffer.from(b,"base64").toString());console.log(JSON.stringify(c,null,2))})'
          echo "==== [DIAG] 直接探测 npm 令牌交换接口 ===="
          curl -sS -o exchange.json -w "HTTP=%{http_code}\n" -X POST \
            -H "Authorization: Bearer $JWT" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-hold-to-talk" || true
          echo "---- 响应体 ----"
          cat exchange.json 2>/dev/null || echo "(无响应体)"
          echo
          echo "==== [DIAG] npm 自身视角的交换过程 ===="
          npm config get registry

      # 本仓库无构建步骤，发布所需文件全部已提交，故不需要 npm ci
      - name: Publish with OIDC
        run: npm publish --access public --loglevel silly
